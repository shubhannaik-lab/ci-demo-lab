name: GitHub Action Workflow
on:
  push:
    branches:
      - main

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Display message
        run: echo "build started"
      - name: List files
        run: ls
      - name: Build succesful
        run: echo "build started successfully"
